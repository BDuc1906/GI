version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      prisma:
        patterns: ["@prisma/*", "prisma"]
      next:
        patterns: ["next", "eslint-config-next"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
