version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      next-ecosystem:
        patterns: ["next", "next-*", "eslint-config-next"]
      ai-sdk:
        patterns: ["@ai-sdk/*", "ai"]
      prisma:
        patterns: ["@prisma/*", "prisma"]
      types:
        patterns: ["@types/*"]
      linters:
        patterns: ["eslint*", "typescript-eslint*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
