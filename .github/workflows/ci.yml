name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# DB giả (service container) — build của app này chạy ISR (revalidate) nên
# `next build` thực sự query DB, không thể giả bằng URL rỗng.
#
# SỬA (2026-09): trước đây chỉ khai báo 1 lần ở đây (cấp workflow) rồi
# trông chờ mọi job/step tự kế thừa — về lý thuyết GitHub Actions có kế
# thừa `env:` cấp workflow xuống mọi job, nhưng job `lint-and-typecheck`
# vẫn báo thiếu `DIRECT_URL` ngay ở bước `npm ci` (hook `postinstall` tự
# chạy `prisma generate`, đọc biến này qua `prisma.config.ts`). Để không
# phụ thuộc vào việc kế thừa ngầm nữa, giờ khai báo TƯỜNG MINH lại ở từng
# job có chạy lệnh cần DB — an toàn hơn và tự mô tả rõ job đó cần gì mà
# không cần đọc ngược lên đầu file.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

# Hủy các run cũ hơn của cùng 1 branch/PR khi có push mới — tránh chạy
# song song nhiều lần cho cùng 1 chuỗi commit, tốn phút GitHub Actions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    # Khai báo tường minh lại (xem giải thích ở env cấp workflow phía
    # trên) — `npm ci` ở bước dưới tự chạy hook `postinstall: prisma
    # generate`, cần DIRECT_URL đọc được NGAY tại thời điểm đó.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Vitest mock hoàn toàn "@prisma/client" (xem tests/setup.ts) nên
        # không cần DB thật hay `prisma generate` chạy xong — an toàn để
        # chạy ngay trong job này, không cần service container Postgres.
        run: npm run test

  build:
    name: Migrate & Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  api-smoke-test:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Start server
        id: server
        # Dùng `background: true` — cơ chế GỐC của GitHub Actions (không
        # phải shell hack, không phải action bên thứ ba) dành riêng cho
        # đúng use case này: chạy một tiến trình dài hạn (server, DB...)
        # sống xuyên suốt các step tiếp theo trong cùng job.
        run: npm run start -- -p 3000
        background: true

      - name: Wait for server to be ready
        # LƯU Ý: đây là step bình thường (poll bằng wait-on), KHÔNG dùng
        # từ khoá `wait:`. `wait: server` nghĩa là "chờ tiến trình nền đó
        # tự KẾT THÚC" — với 1 server thì nó không bao giờ tự thoát.
        run: npx wait-on http://localhost:3000/api/health -t 60000

      - name: Check /api index
        run: |
          set -e
          curl -sf http://localhost:3000/api | tee /tmp/api.json
          grep -q '"success":true' /tmp/api.json

      - name: Check /api/characters shape
        run: |
          set -e
          curl -sf "http://localhost:3000/api/characters?limit=1" | tee /tmp/characters.json
          grep -q '"success":true' /tmp/characters.json
          grep -q '"meta"' /tmp/characters.json

      - name: Check /api/characters validation (400)
        run: |
          status=$(curl -s -o /tmp/bad.json -w "%{http_code}" "http://localhost:3000/api/characters?rarity=9")
          cat /tmp/bad.json
          test "$status" = "400"

      - name: Check /api/characters/:id (404)
        run: |
          status=$(curl -s -o /tmp/notfound.json -w "%{http_code}" "http://localhost:3000/api/characters/khong-ton-tai")
          cat /tmp/notfound.json
          test "$status" = "404"

      - name: Stop server
        # Dừng tiến trình nền một cách "sạch" (SIGTERM, sau đó SIGKILL nếu
        # không thoát kịp). Step `cancel` luôn tự chạy mặc định (kể cả khi
        # step trước đó fail), không cần/không hỗ trợ `if:`.
        cancel: server

  # ────────────────────────────────────────────────────────────────────
  # CD — chỉ chạy khi push thẳng vào main (không chạy cho PR) và chỉ sau
  # khi lint/typecheck/test + migrate/build + smoke-test API đều pass.
  # Đây là job duy nhất chạm vào DB production thật và deploy thật lên
  # Vercel — Vercel Git integration đã bị tắt qua ignoreCommand trong
  # vercel.json, nên job này là con đường DUY NHẤT đưa code lên production.
  # ────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: api-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Apply migrations to production database
        # DIRECT_URL THẬT của Neon production, lấy từ GitHub Secrets —
        # KHÁC với DATABASE_URL/DIRECT_URL giả ở đầu file (chỉ dùng cho
        # các job test ở trên). prisma.config.ts đọc DIRECT_URL cho mọi
        # lệnh `prisma migrate`, nên không cần set DATABASE_URL ở bước này.
        #
        # Retry 3 lần: đã xác nhận bằng tay lỗi P1001/ECONNREFUSED ở bước
        # này chỉ thoáng qua (kết nối trực tiếp từ máy khác thành công
        # cùng thời điểm CI báo lỗi) — nhiều khả năng do độ trễ/nghẽn mạng
        # ngẫu nhiên giữa GitHub Actions runner và Neon.
        run: |
          for attempt in 1 2 3; do
            npx prisma migrate deploy && exit 0
            echo "Lần $attempt thất bại, thử lại sau $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "Đã thử 3 lần đều thất bại."
          exit 1
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      # Seed dữ liệu game (data/raw/*.json, đã qua review PR + CI) vào DB
      # production — an toàn vì scripts/seed đọc từ file ĐÃ COMMIT trong
      # repo, không gọi genshin-db trực tiếp lúc này.
      - name: Seed production database with latest game data
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        # Ép Node ưu tiên IPv4 khi resolve DNS (đề phòng khác biệt IPv4/
        # IPv6 giữa Prisma Rust engine và thư viện `pg`). Retry 3 lần cùng
        # lý do đã xác nhận ở bước migrate.
        run: |
          for attempt in 1 2 3; do
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} && exit 0
            echo "Lần $attempt thất bại, thử lại sau $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "Đã thử 3 lần đều thất bại."
          exit 1
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Deployed to production: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
