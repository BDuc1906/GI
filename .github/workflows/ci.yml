name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # DB thật (service container) — build của app này chạy ISR (revalidate)
  # nên `next build` thực sự query DB, không thể giả bằng URL rỗng.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  build:
    name: Migrate & Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  api-smoke-test:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Start server
        run: npm run start -- -p 3000 &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/api/health -t 60000

      - name: Check /api index
        run: |
          set -e
          curl -sf http://localhost:3000/api | tee /tmp/api.json
          grep -q '"success":true' /tmp/api.json

      - name: Check /api/characters shape
        run: |
          set -e
          curl -sf "http://localhost:3000/api/characters?limit=1" | tee /tmp/characters.json
          grep -q '"success":true' /tmp/characters.json
          grep -q '"meta"' /tmp/characters.json

      - name: Check /api/characters validation (400)
        run: |
          status=$(curl -s -o /tmp/bad.json -w "%{http_code}" "http://localhost:3000/api/characters?rarity=9")
          cat /tmp/bad.json
          test "$status" = "400"

      - name: Check /api/characters/:id (404)
        run: |
          status=$(curl -s -o /tmp/notfound.json -w "%{http_code}" "http://localhost:3000/api/characters/khong-ton-tai")
          cat /tmp/notfound.json
          test "$status" = "404"
