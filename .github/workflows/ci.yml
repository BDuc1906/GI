name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# DB service container env for tests and build
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code & Asset Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests (Vitest)
        run: npm run test

      - name: Asset Validation Gate
        run: npm run assets:validate

      - name: Character Build Validation Gate (KQM 4-Layer)
        run: npm run builds:update

      - name: Translation Quality Gate (i18n Coverage & Integrity)
        run: npm run i18n:validate

  build-and-smoke:
    name: Build, API Smoke & Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npx tsx scripts/seed/seed.ts

      - name: Build Next.js application
        run: npm run build

      - name: Start server & Run API Smoke Tests
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/leibo-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          echo "Waiting for Next.js server to be healthy..."
          curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 1 --max-time 3 http://localhost:3000/api/health > /dev/null || {
            cat /tmp/leibo-next.log
            exit 1
          }

          echo "Validating API endpoints..."
          curl -sf http://localhost:3000/api | tee /tmp/api.json
          grep -q '"success":true' /tmp/api.json

          curl -sf "http://localhost:3000/api/characters?limit=1" | tee /tmp/characters.json
          grep -q '"success":true' /tmp/characters.json
          grep -q '"meta"' /tmp/characters.json

          curl -sf "http://localhost:3000/api/search?q=raiden&locale=en&limit=1" | tee /tmp/search.json
          grep -q '"success":true' /tmp/search.json
          grep -q '"characters":' /tmp/search.json

          status=$(curl -s -o /tmp/bad.json -w "%{http_code}" "http://localhost:3000/api/characters?rarity=9")
          cat /tmp/bad.json
          test "$status" = "400"

          status=$(curl -s -o /tmp/notfound.json -w "%{http_code}" "http://localhost:3000/api/characters/khong-ton-tai")
          cat /tmp/notfound.json
          test "$status" = "404"

          echo "API Smoke Tests PASSED."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/home.spec.ts --project=chromium
