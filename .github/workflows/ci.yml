name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# DB giả (service container) — build của app này chạy ISR (revalidate) nên
# `next build` thực sự query DB, không thể giả bằng URL rỗng.
#
# SỬA (2026-09): trước đây chỉ khai báo 1 lần ở đây (cấp workflow) rồi
# trông chờ mọi job/step tự kế thừa — về lý thuyết GitHub Actions có kế
# thừa `env:` cấp workflow xuống mọi job, nhưng job `lint-and-typecheck`
# vẫn báo thiếu `DIRECT_URL` ngay ở bước `npm ci` (hook `postinstall` tự
# chạy `prisma generate`, đọc biến này qua `prisma.config.ts`). Để không
# phụ thuộc vào việc kế thừa ngầm nữa, giờ khai báo TƯỜNG MINH lại ở từng
# job có chạy lệnh cần DB — an toàn hơn và tự mô tả rõ job đó cần gì mà
# không cần đọc ngược lên đầu file.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

# Hủy các run cũ hơn của cùng 1 branch/PR khi có push mới — tránh chạy
# song song nhiều lần cho cùng 1 chuỗi commit, tốn phút GitHub Actions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    # Khai báo tường minh lại (xem giải thích ở env cấp workflow phía
    # trên) — `npm ci` ở bước dưới tự chạy hook `postinstall: prisma
    # generate`, cần DIRECT_URL đọc được NGAY tại thời điểm đó.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Vitest mock hoàn toàn "@prisma/client" (xem tests/setup.ts) nên
        # không cần DB thật hay `prisma generate` chạy xong — an toàn để
        # chạy ngay trong job này, không cần service container Postgres.
        run: npm run test

  build:
    name: Migrate & Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  api-smoke-test:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: API smoke tests
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/leibo-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          npx wait-on http://localhost:3000/api/health -t 60000 || {
            cat /tmp/leibo-next.log
            exit 1
          }

          curl -sf http://localhost:3000/api | tee /tmp/api.json
          grep -q '"success":true' /tmp/api.json

          curl -sf "http://localhost:3000/api/characters?limit=1" | tee /tmp/characters.json
          grep -q '"success":true' /tmp/characters.json
          grep -q '"meta"' /tmp/characters.json

          status=$(curl -s -o /tmp/bad.json -w "%{http_code}" "http://localhost:3000/api/characters?rarity=9")
          cat /tmp/bad.json
          test "$status" = "400"

          status=$(curl -s -o /tmp/notfound.json -w "%{http_code}" "http://localhost:3000/api/characters/khong-ton-tai")
          cat /tmp/notfound.json
          test "$status" = "404"

