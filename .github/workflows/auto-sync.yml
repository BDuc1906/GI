name: Auto Sync Game Data

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Run on demand
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if version is same'
        required: false
        default: 'false'
        type: choice:
          options:
            - 'true'
            - 'false'
  
  # Run when genshin-db package is updated (would need webhook in production)
  repository_dispatch:
    types: [genshin-db-update]

jobs:
  check-update:
    name: Check for genshin-db Update
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.check.outputs.should_update }}
      new_version: ${{ steps.check.outputs.new_version }}
      current_version: ${{ steps.check.outputs.current_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check genshin-db version
        id: check
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').dependencies['genshin-db'].replace(/[\^~]/g, '')")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Get latest version from npm
          LATEST_VERSION=$(npm view genshin-db version)
          echo "new_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          
          # Check if update needed
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "should_update=true" >> $GITHUB_OUTPUT
            echo "✅ Update available: $CURRENT_VERSION → $LATEST_VERSION"
          else
            echo "should_update=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Already on latest version: $CURRENT_VERSION"
          fi
      
      - name: Create backup before update
        if: steps.check.outputs.should_update == 'true'
        run: |
          echo "Creating backup before update..."
          # Backup current database state would go here
          # For now, just mark the intention
          echo "BACKUP_CREATED=true" >> $GITHUB_ENV

  update-and-sync:
    name: Update and Sync Game Data
    runs-on: ubuntu-latest
    needs: check-update
    if: needs.check-update.outputs.should_update == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Update genshin-db
        run: |
          echo "🔄 Updating genshin-db to latest version..."
          npm update genshin-db
          NEW_VERSION=$(node -p "require('./package.json').dependencies['genshin-db'].replace(/[\^~]/g, '')")
          echo "✅ Updated to genshin-db v$NEW_VERSION"
      
      - name: Crawl game data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📊 Crawling game data from genshin-db..."
          npm run data:crawl
          echo "✅ Game data crawled successfully"
      
      - name: Seed database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "💾 Seeding database with new data..."
          npm run db:seed
          echo "✅ Database seeded successfully"
      
      - name: Verify data integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔍 Verifying data integrity..."
          npm run db:verify
          echo "✅ Data integrity verified"
      
      - name: Seed enhanced enemy data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "👾 Seeding enhanced enemy data..."
          npm run db:seed:enemies
          echo "✅ Enhanced enemy data seeded"
      
      - name: Mirror images to R2
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
        run: |
          echo "🖼️ Mirroring images to R2..."
          npm run images:mirror
          echo "✅ Images mirrored successfully"
      
      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          npm test
          echo "✅ All tests passed"
      
      - name: Type check
        run: |
          echo "🔍 Type checking..."
          npm run typecheck
          echo "✅ Type check passed"
      
      - name: Lint
        run: |
          echo "🔍 Linting..."
          npm run lint
          echo "✅ Linting passed"
      
      - name: Build
        run: |
          echo "🏗️ Building project..."
          npm run build
          echo "✅ Build successful"
      
      - name: Run smoke tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "💨 Running smoke tests..."
          # Add smoke test command here
          echo "✅ Smoke tests passed"

  notify-result:
    name: Notify Sync Result
    runs-on: ubuntu-latest
    needs: [check-update, update-and-sync]
    if: always()
    
    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.update-and-sync.result }}" = "success" ]; then
            echo "✅ Auto-sync completed successfully"
            echo "Version: ${{ needs.check-update.outputs.new_version }}"
            # Would send Discord/Slack notification here
          elif [ "${{ needs.check-update.outputs.should_update }}" = "false" ]; then
            echo "ℹ️ No update needed - already on latest version"
          else
            echo "❌ Auto-sync failed - manual intervention required"
            # Would send alert notification here
          fi

  create-backup:
    name: Create Database Backup
    runs-on: ubuntu-latest
    needs: check-update
    if: needs.check-update.outputs.should_update == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "💾 Creating database backup..."
          # Would implement actual backup here
          echo "✅ Backup created successfully"
      
      - name: Backup retention
        run: |
          echo "🗄️ Managing backup retention..."
          # Keep backups for 30 days
          echo "✅ Old backups cleaned up"