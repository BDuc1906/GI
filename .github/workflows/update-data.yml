name: Update Game Data

on:
  schedule:
    # 5:00 UTC+7 = 22:00 UTC, hàng tuần vào thứ 4
    - cron: '0 22 * * 3'
  workflow_dispatch: # cho phép chạy tay

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

jobs:
  check-update:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run data crawl
        run: npm run data:crawl

      - name: Run seed on test DB
        run: npm run db:seed

      - name: Run integrity verification
        id: verify
        continue-on-error: true
        run: npm run db:verify

      - name: Check for changes in data/raw/
        id: diff
        run: |
          git add data/raw/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with updated data
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): update game data from genshin-db"
          title: "chore(data): update game data"
          branch: "auto/update-data-$(date +'%Y%m%d')"
          delete-branch: true
          labels: "data-update"
          body: |
            ## Data update from latest genshin-db

            - [x] Crawl and seed completed
            - [x] Integrity verification passed

            Please review and merge if everything looks correct.

            _This PR was automatically generated by the `update-data` workflow._

      - name: Create issue if verification failed
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Data integrity check failed after update',
              body: `The latest data from genshin-db failed the integrity check.\n\nCheck the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['data-update', 'bug']
            })