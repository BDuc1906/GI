name: Update Game Data

on:
  schedule:
    # 4:00 AM UTC+7 (21:00 UTC) hàng ngày
    - cron: '0 21 * * *'
  workflow_dispatch: # cho phép chạy tay bất cứ lúc nào

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and update upstream genshin-db
        run: |
          LATEST=$(npm view genshin-db version 2>/dev/null || echo "")
          CURRENT=$(node -p "require('./package.json').dependencies['genshin-db']?.replace(/[\^~]/g, '') || ''")
          echo "Current genshin-db: $CURRENT | Latest on npm: $LATEST"
          if [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "Upgrading genshin-db from $CURRENT to $LATEST..."
            npm install "genshin-db@$LATEST" --save
          fi

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Sync metadata & discover game versions
        run: npx tsx scripts/sync/update-data.ts

      - name: Run data crawl
        run: npm run data:crawl

      - name: Sync authentic game assets from CDN
        run: npm run assets:sync

      - name: Run seed on test DB
        run: npx tsx scripts/seed/seed.ts

      - name: Run integrity verification
        id: verify
        continue-on-error: true
        run: npx tsx scripts/seed/verify-seed-integrity.ts

      - name: Run test suite
        run: npm test

      - name: Check for changes
        id: diff
        run: |
          git add -f data/raw/ scripts/data/ package.json package-lock.json public/local-genshin-assets/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Không có dữ liệu game mới nào cần commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "🆕 Phát hiện dữ liệu hoặc asset mới!"
          fi

      - name: Commit and push directly to main
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'success'
        id: push-main
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): auto-update game data to latest release [skip ci]"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Fallback to Pull Request if direct push is restricted
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'success' && steps.push-main.outcome == 'failure'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): update game data to latest release"
          title: "chore(data): auto-update game data"
          branch: "auto/update-data"
          delete-branch: true
          labels: "data-update"
          body: |
            ## Automated Game Data Update
            - [x] Crawl and seed completed
            - [x] Authentic assets downloaded
            - [x] Integrity verification passed
            - [x] Automated unit tests passed

      - name: Enable auto-merge if PR created
        if: steps.create-pr.outputs.pull-request-number
        run: |
          PR_NUM="${{ steps.create-pr.outputs.pull-request-number }}"
          gh pr merge --auto --squash "$PR_NUM" || echo "Auto-merge could not be set automatically."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue if verification failed
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Data integrity check failed after auto-update',
              body: `The latest game data update failed the integrity verification.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['data-update', 'bug']
            })
