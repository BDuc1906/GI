name: Auto Fix Data

# Quét và điều chỉnh dữ liệu production lệch với live source.
# Chạy có kiểm soát thông qua workflow_dispatch với xác nhận an toàn.

on:
  workflow_dispatch:
    inputs:
      confirm_fix:
        description: 'Type "CONFIRM_FIX" to execute auto-fix on Production DB'
        required: true
        type: string

concurrency:
  group: leibo-production-database
  cancel-in-progress: false

jobs:
  auto-fix:
    name: Quét và sửa dữ liệu Production (Có kiểm soát)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      issues: write

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_fix }}" != "CONFIRM_FIX" ]; then
            echo "::error::Confirmation token mismatch. Expected 'CONFIRM_FIX', received '${{ github.event.inputs.confirm_fix }}'."
            exit 1
          fi
          echo "✅ Confirmation token accepted."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Validate production database secrets
        id: check_db
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "has_db=false" >> $GITHUB_OUTPUT
            echo "::error::Missing database secret (DATABASE_URL or PROD_DATABASE_URL)."
            exit 1
          else
            echo "has_db=true" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}

      - name: Quét & tự sửa (AutoFixEngine)
        if: steps.check_db.outputs.has_db == 'true'
        run: npx tsx scripts/pipeline/auto-fix.ts
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          AGENT_LIVE_PROVIDER: ${{ vars.AGENT_LIVE_PROVIDER }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}

      - name: Đợi 10 phút trước khi kiểm tra lại
        if: steps.check_db.outputs.has_db == 'true'
        run: sleep 600

      - name: Kiểm tra lại + tự revert nếu live không còn khớp
        if: steps.check_db.outputs.has_db == 'true'
        run: npx tsx scripts/pipeline/verify-rollback.ts --window-minutes=20
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          AGENT_LIVE_PROVIDER: ${{ vars.AGENT_LIVE_PROVIDER }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}

      - name: Tạo issue nếu cả 2 bước trên fail
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Workflow auto-fix thất bại trên Production',
              body: `Xem chi tiết: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['auto-fix', 'bug'],
            })
