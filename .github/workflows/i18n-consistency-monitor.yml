name: Translation Consistency Monitor

on:
  schedule:
    # 6:30 UTC+7 = 23:30 UTC
    - cron: '30 23 * * *'
  workflow_dispatch:

concurrency:
  group: i18n-consistency-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      issues: write
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production database secrets
        run: |
          : "${DATABASE_URL:?Missing database secret (DATABASE_URL or PROD_DATABASE_URL)}"
          : "${DIRECT_URL:?Missing database secret (DIRECT_URL, PROD_DIRECT_URL or DATABASE_URL)}"

      - name: Run translation consistency checker (read-only)
        run: npx tsx scripts/i18n/translation-consistency-checker.ts --check-terminology --check-formatting --check-length

      - name: Read consistency report
        id: report
        run: |
          if [ ! -f scripts/i18n/consistency-report.json ]; then
            echo "::error::Translation checker did not generate consistency-report.json. Check the checker step for a database/configuration error."
            exit 1
          fi
          ERRORS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scripts/i18n/consistency-report.json','utf-8')).bySeverity.error || 0)")
          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"

      - name: Create or update issue if consistency errors found
        if: steps.report.outputs.errors != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('scripts/i18n/consistency-report.json', 'utf-8'));

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'i18n-consistency',
            });

            const topIssues = report.issues
              .filter(i => i.severity === 'error')
              .slice(0, 15)
              .map(i => `- [${i.locale}] ${i.entityType} "${i.entityName}" (${i.field}): ${i.description}`)
              .join('\n');
            const body = `Translation Consistency Monitor tìm thấy ${report.bySeverity.error} lỗi (severity=error), ` +
              `tổng ${report.totalIssues} issue.\n\n**15 lỗi đầu tiên:**\n${topIssues}\n\n` +
              `Xem đầy đủ: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Chạy lại tay để re-generate các bản dịch bị lỗi:\n` +
              `\`npm run i18n:translate-with-glossary -- --locale=<locale> --only=<characters|weapons>\``;

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `🟡 Lần chạy hôm nay:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🟡 Translation consistency: ${report.bySeverity.error} error(s) found`,
                body: body + `\n\n_Issue này KHÔNG tự đóng — đóng tay sau khi đã xử lý xong._`,
                labels: ['i18n-consistency'],
              });
            }
