name: Full Data Pipeline

# Pipeline hoàn chỉnh: Crawl → Seed → Auto-fix → Deploy
# Chạy hàng tuần vào thứ 4 lúc 22:00 UTC (5:00 sáng thứ 5 Việt Nam)
# Có thể chạy tay khi cần

on:
  schedule:
    - cron: '0 22 * * 4' # 22:00 UTC thứ 4
  workflow_dispatch:

concurrency:
  group: full-pipeline
  cancel-in-progress: false # không huỷ nửa chừng đang ghi DB

jobs:
  crawl:
    name: Crawl from genshin-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl latest game data
        run: npm run data:crawl

      - name: Upload crawled data
        uses: actions/upload-artifact@v7
        with:
          name: crawled-data
          path: data/raw/
          retention-days: 1

  seed:
    name: Seed database
    runs-on: ubuntu-latest
    needs: crawl
    environment: production
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download crawled data
        uses: actions/download-artifact@v8
        with:
          name: crawled-data
          path: data/raw/

      - name: Prisma generate
        run: npx prisma generate

      - name: Seed production database
        run: npx tsx scripts/seed/seed.ts
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}

  auto-fix:
    name: Auto-fix data
    runs-on: ubuntu-latest
    needs: seed
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leibo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leibo_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Run AutoFixEngine
        run: npx tsx scripts/pipeline/auto-fix.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AGENT_LIVE_PROVIDER: ${{ vars.AGENT_LIVE_PROVIDER }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}

      - name: Wait 30 minutes before verification
        run: sleep 1800

      - name: Verify and rollback if needed
        run: npx tsx scripts/pipeline/verify-rollback.ts --window-minutes=40
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AGENT_LIVE_PROVIDER: ${{ vars.AGENT_LIVE_PROVIDER }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}

      - name: Create issue if failed
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Full pipeline failed',
              body: `Xem chi tiết: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['pipeline', 'bug'],
            })

      - name: Pipeline summary
        run: |
          echo "✅ Full data pipeline completed successfully. Vercel Web will deploy any pushed changes automatically." >> "$GITHUB_STEP_SUMMARY"